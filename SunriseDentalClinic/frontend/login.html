<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Login - Sunrise Dental Clinic</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-header">
                <div class="auth-logo">
                    <svg viewBox="0 0 24 24">
                        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14h2v2h-2v-2zm0-10h2v8h-2V6z"/>
                    </svg>
                </div>
                <h1>SUNRISE DENTAL CLINIC</h1>
                <p>Appointment &amp; Patient Management System</p>
            </div>

            <!-- Demo Account Credentials Box -->
            <div class="auth-demo-badge">
                <strong>Development Account:</strong><br>
                Username: <code>admin</code> &nbsp;|&nbsp; Password: <code>Admin@123</code>
            </div>

            <!-- Alert Notification Container -->
            <div id="alert-container"></div>

            <form id="login-form" novalidate>
                <div class="form-group">
                    <label for="username">Username <span class="required">*</span></label>
                    <input type="text" id="username" class="form-control" placeholder="Enter username" required autocomplete="username">
                </div>

                <div class="form-group">
                    <label for="password">Password <span class="required">*</span></label>
                    <input type="password" id="password" class="form-control" placeholder="Enter password" required autocomplete="current-password">
                </div>

                <button type="submit" id="btn-login-submit" class="btn btn-primary btn-block" style="margin-top: 1rem;">
                    LOGIN
                </button>
            </form>

            <div class="auth-footer">
                Don't have an account? <br>
                <a href="signup.html">Create Account / Sign Up</a>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/common.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
