<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Appointments - Sunrise Dental Clinic</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="navbar-placeholder"></div>

    <main class="container">
        <div class="page-header">
            <div class="page-header-info">
                <h1>Appointment Records</h1>
                <p>Manage, search, and track all patient dental appointments</p>
            </div>
            <div>
                <a href="new-appointment.html" class="btn btn-primary">➕ New Appointment</a>
            </div>
        </div>

        <div id="alert-container"></div>

        <!-- Filter and Search Bar -->
        <div class="card" style="padding: 1rem 1.25rem;">
            <div style="display: flex; gap: 1rem; flex-wrap: wrap; align-items: center; justify-content: space-between;">
                <div style="display: flex; gap: 0.75rem; flex: 1; min-width: 280px;">
                    <input type="text" id="search-input" class="form-control" placeholder="Search by patient, appt no, dentist, treatment...">
                    <button type="button" id="btn-search" class="btn btn-secondary">Search</button>
                </div>

                <div style="display: flex; align-items: center; gap: 0.5rem;">
                    <label for="status-filter" style="font-weight: 500; font-size: 0.9rem; margin-bottom: 0;">Status:</label>
                    <select id="status-filter" class="form-control" style="width: auto;">
                        <option value="ALL">All Statuses</option>
                        <option value="SCHEDULED">Scheduled</option>
                        <option value="COMPLETED">Completed</option>
                        <option value="CANCELLED">Cancelled</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Appointments Table -->
        <div class="table-responsive">
            <table class="table" id="appointments-table">
                <thead>
                    <tr>
                        <th>Appointment No</th>
                        <th>Patient Details</th>
                        <th>Dentist</th>
                        <th>Treatment</th>
                        <th>Date</th>
                        <th>Time</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="appointments-tbody">
                    <tr>
                        <td colspan="8" style="text-align: center; color: var(--text-muted); padding: 2rem;">
                            Loading appointment records...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

    <footer class="footer">
        <p>&copy; 2026 Sunrise Dental Clinic, Colombo. All rights reserved.</p>
    </footer>

    <script src="js/api.js"></script>
    <script src="js/common.js"></script>
    <script src="js/appointments.js"></script>
</body>
</html>
