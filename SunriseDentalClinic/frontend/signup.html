<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Registration - Sunrise Dental Clinic</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <div class="auth-wrapper">
        <div class="auth-card auth-card-wide">
            <div class="auth-header">
                <div class="auth-logo">
                    <svg viewBox="0 0 24 24">
                        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14h2v2h-2v-2zm0-10h2v8h-2V6z"/>
                    </svg>
                </div>
                <h1>STAFF REGISTRATION</h1>
                <p>Register an authorized clinic staff account</p>
            </div>

            <!-- Alert Notification Container -->
            <div id="alert-container"></div>

            <form id="signup-form" novalidate>
                <div class="form-grid">
                    <div class="form-group">
                        <label for="username">Username <span class="required">*</span></label>
                        <input type="text" id="username" class="form-control" placeholder="e.g. kperera" required autocomplete="username">
                        <p class="form-help">Unique username (3-30 alphanumeric characters)</p>
                    </div>

                    <div class="form-group">
                        <label for="staffId">Staff ID <span class="required">*</span></label>
                        <input type="text" id="staffId" class="form-control" placeholder="e.g. STF002" required>
                        <p class="form-help">Assigned clinic identifier (e.g. STF002)</p>
                    </div>
                </div>

                <div class="form-grid">
                    <div class="form-group">
                        <label for="firstName">First Name <span class="required">*</span></label>
                        <input type="text" id="firstName" class="form-control" placeholder="e.g. Kasun" required>
                    </div>

                    <div class="form-group">
                        <label for="lastName">Last Name <span class="required">*</span></label>
                        <input type="text" id="lastName" class="form-control" placeholder="e.g. Perera" required>
                    </div>
                </div>

                <div class="form-grid">
                    <div class="form-group">
                        <label for="password">Password <span class="required">*</span></label>
                        <input type="password" id="password" class="form-control" placeholder="Minimum 6 characters" required autocomplete="new-password">
                    </div>

                    <div class="form-group">
                        <label for="confirmPassword">Confirm Password <span class="required">*</span></label>
                        <input type="password" id="confirmPassword" class="form-control" placeholder="Re-enter password" required autocomplete="new-password">
                    </div>
                </div>

                <button type="submit" id="btn-signup-submit" class="btn btn-primary btn-block" style="margin-top: 1rem;">
                    REGISTER
                </button>
            </form>

            <div class="auth-footer">
                Already have an account? <br>
                <a href="login.html">Login</a>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/common.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
